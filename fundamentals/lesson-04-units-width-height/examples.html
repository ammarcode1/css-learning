<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Lesson 04 - Units & Sizes</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main heading -->
    <h1>CSS Units & Sizes</h1>

    <!-- Introduction -->
    <p>This page demonstrates different CSS units and element sizes.</p>

    <!-- Fixed size box -->
    <div class="fixed-box">
        <h2>Fixed Size</h2>
        <p>This box uses pixels for width and height.</p>
    </div>

    <!-- Percentage width box -->
    <div class="percentage-box">
        <h2>Percentage Width</h2>
        <p>This box uses percentage-based width.</p>
    </div>

    <!-- Responsive container -->
    <div class="container">
        <h2>Responsive Container</h2>
        <p>This container uses width and max-width.</p>
    </div>

</body>

</html>
