<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Lesson 06 - Text & Fonts</title>

    <!-- Connect the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Page heading -->
    <h1>Student Profile</h1>

    <!-- Profile card -->
    <div class="profile-card">

        <!-- Student name -->
        <h2>Muhammad Ammar</h2>

        <!-- Student description -->
        <p>
            Software Engineering student learning HTML, CSS,
            JavaScript, and backend development.
        </p>

        <!-- Student role -->
        <p class="role">Web Development Learner</p>

        <!-- Profile link -->
        <a href="#">View Profile</a>

    </div>

    <!-- Another section -->
    <section class="goals">

        <h2>Learning Goals</h2>

        <p>
            Improve web development skills and build practical
            projects with clean and readable interfaces.
        </p>

    </section>

</body>

</html>
